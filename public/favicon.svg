<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="96" height="96" rx="24" stroke="url(#neonGlow)" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Ambient Internal Pulse -->
  <circle cx="50" cy="50" r="32" fill="#4FACFE" opacity="0.12" filter="url(#glow)" />

  <!-- AnyShare Flow Waves (Synchronized Data Loops) -->
  <path d="M26 38 C 26 26, 46 22, 54 22 C 68 22, 74 30, 74 38 C 74 46, 68 50, 50 50" stroke="url(#neonGlow)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M74 62 C 74 74, 54 78, 46 78 C 32 78, 26 70, 26 62 C 26 54, 32 50, 50 50" stroke="url(#neonGlow)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- One Tap Bolt & Play Trigger in Center -->
  <path d="M47 34 L59 48 L51 50 L55 66 L42 51 L48 49 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Hardware Node Status Indicator -->
  <circle cx="74" cy="26" r="3.5" fill="#10B981" />
  <circle cx="74" cy="26" r="6" stroke="#10B981" stroke-width="1" opacity="0.5" />
</svg>
