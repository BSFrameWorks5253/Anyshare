<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pearlWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FCF9F2" />
      <stop offset="100%" stop-color="#F5EFE0" />
    </linearGradient>
    <linearGradient id="islamicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7A9" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8B6508" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Pearl White Squircle -->
  <rect width="100" height="100" rx="26" fill="url(#pearlWhite)" />
  <rect x="2.5" y="2.5" width="95" height="95" rx="23.5" stroke="url(#islamicGold)" stroke-width="2.5" />

  <!-- Ambient Gold Center Halo -->
  <circle cx="50" cy="50" r="30" fill="#D4AF37" opacity="0.12" />

  <!-- Islamic Sharing Arc Waves -->
  <path d="M26 40 C 26 27, 46 22, 54 22 C 68 22, 74 30, 74 40 C 74 48, 66 50, 50 50" stroke="url(#islamicGold)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#softShadow)" />
  <path d="M74 60 C 74 73, 54 78, 46 78 C 32 78, 26 70, 26 60 C 26 52, 34 50, 50 50" stroke="url(#islamicGold)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#softShadow)" />

  <!-- Royal Gold Render Bolt & Crescent Spark -->
  <path d="M47 34 L59 48 L51 50 L55 66 L42 51 L48 49 Z" fill="url(#islamicGold)" filter="url(#softShadow)" />

  <!-- Emerald Verified Gem -->
  <circle cx="74" cy="26" r="4" fill="#059669" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
