<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="192" height="192" rx="48" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="184" height="184" rx="44" stroke="url(#neonGlow)" stroke-width="3" stroke-opacity="0.45" />

  <!-- Ambient Internal Pulse -->
  <circle cx="96" cy="96" r="62" fill="#4FACFE" opacity="0.12" filter="url(#glow)" />

  <!-- AnyShare Flow Waves (Synchronized Data Loops) -->
  <path d="M50 72 C 50 48, 88 42, 104 42 C 130 42, 142 58, 142 72 C 142 88, 130 96, 96 96" stroke="url(#neonGlow)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M142 120 C 142 144, 104 150, 88 150 C 62 150, 50 134, 50 120 C 50 104, 62 96, 96 96" stroke="url(#neonGlow)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- One Tap Bolt & Play Trigger in Center -->
  <path d="M90 64 L114 92 L98 96 L106 128 L80 98 L92 94 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Hardware Node Status Indicator -->
  <circle cx="142" cy="50" r="7" fill="#10B981" />
  <circle cx="142" cy="50" r="12" stroke="#10B981" stroke-width="2" opacity="0.5" />
</svg>
